name: Import verified synthetic source bundle

on:
  push:
    paths:
      - '.staging/**'
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'Upload staged source bundle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack source archive
        shell: bash
        run: |
          cat .staging/part-* | base64 --decode > /tmp/union-harbor-source.br
          node -e "const fs=require('fs'); const z=require('zlib');fs.writeFileSync('/tmp/union-harbor-source.tar',z.brotliDecompressSync(fs.readFileSync('/tmp/union-harbor-source.br')))"
          tar -xf /tmp/union-harbor-source.tar
          rm -rf .staging
          # Do not change workflow files in this commit: the automation token lacks workflow-update permission.
          # CI is installed separately using the connected GitHub file API.
          rm -f .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import application source, tests, docs and synthetic fixtures"
          git push
