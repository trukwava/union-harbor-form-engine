name: Verify source build and acceptance tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript build dependency
        run: npm install --no-audit --no-fund
      - name: Install LibreOffice for PDF integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer
      - name: Compile and run tests
        run: npm test
